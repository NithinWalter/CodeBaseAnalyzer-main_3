variables:
  scheduleJob: "false"
  operation: "config"
  GENERATE_SUGGESTIONS: "false"
  ROLE_MINING: "false"
  

workflow:
  name: "$APPLICAION PipeLine"
  rules:
    - if: $CI_PIPELINE_TRIGGERED == "true"
    - if: $operation == "validate"
    - if: $operation == "config"
    - if: $GENERATE_SUGGESTIONS == "false"
    - if: $ROLE_MINING == "true"
    - if: $scheduleJob =="true"
    - when: never

stages:
  - Pre-Processing
  - Validation
  - AI Suggestions
  - AI Role Mining 
  - Configuration
  - Reports
  - ServiceNow
  - Post Prod Sign Off

  

extractFiles:
  stage: Pre-Processing
  image: python:latest
  rules:
    - if: $operation == "validate"
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/extract.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  when: always

scheduledDataExtract:
  stage: Pre-Processing
  image: python:latest
  rules:
    - if: $scheduleJob =="true"
  script:
    - apt-get update && apt-get install -y git
    # Configure Git identity for CI commits
    - git config --global user.email "ci-bot@example.com"
    - git config --global user.name "CI Bot"
    # Reset remote URL to use CI_JOB_TOKEN for authentication
    - git remote set-url origin https://haribalanofficial:glpat-mRvT2HLveY111B5TLKjOY286MQp1Omc0OXNxCw.01.120xpphbm@gitlab.com/seleniumautomation9702015/iga-saviynt-factory.git
    - pip install -r requirements.txt
    - python3 src/jobs/extractDB.py 
    - python3 src/jobs/polling.py   

    - git add artifacts/*

    # Commit & push only if changes are present
    - |
      if ! git diff --cached --quiet; then
        git commit -m "update extracted artifacts"
        git push origin HEAD:refs/heads/Developnment

      else
        echo "No changes detected in artifacts, skipping commit."
      fi
  artifacts:
    paths:
        - artifacts/
    expire_in: 30 days
  when: always

validateFile:
  stage: Validation
  image: python:latest
  rules:
    - if: $operation == "validate"
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/extractDB.py
    - python3 src/jobs/validate.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  when: always

generateSuggestions:
  stage: AI Suggestions
  needs: [validateFile,extractFiles]
  rules:
    - if: '$GENERATE_SUGGESTIONS == "true"'
  image: python:3.11-slim
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - pip install -r requirements.txt
    # pip install sentence-transformers  torch
    - python3 src/jobs/generateSuggestions.py
  when: always

generateRoleRecommendation:
  stage: AI Role Mining
  needs:  
    - job: validateFile
    - job: extractFiles
    - job: generateSuggestions
      optional: true 
  rules:
    - if: $ROLE_MINING == "true"
  image: python:3.11-slim
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - pip install -r requirements.txt
    - pip install scikit-learn
    - python3 src/jobs/roleMining.py

configureSaviynt:
  stage: Configuration
  rules:
  - if: '$operation == "config"'
  - when: never
  needs:
    - job: extractFiles
      artifacts: true
      optional: true
    - job: validateFile
      artifacts: true
      optional: true
  image: python:3.11-slim
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/config.py
  when: always

generateReports:
  stage: Reports
  needs:
  - job: extractFiles
    artifacts: true
    optional: true
  - job: validateFile
    artifacts: true
    optional: true
  - job: configureSaviynt
    artifacts: true

  rules:
  - if: $operation == "config"
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/reports.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 90 days
  when: always


createSCTasks:
  stage: ServiceNow
  needs: [generateReports]
  image: python:3.11-slim
  rules:
  - if: '$operation == "config"'
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/snowtask.py
  artifacts:
    paths: [sc_tasks.json]
    expire_in: 30 days
  when: always

signOff:
  stage: Post Prod Sign Off
  needs: [createSCTasks]
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/reports.py
  artifacts:
    paths: [task_status.json]
    expire_in: 30 days
  rules:
  - if: '$operation == "config"'
  when: manual

