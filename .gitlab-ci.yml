workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: always
    - when: never

stages:
  - Validation
  - AI Agent
  - Configuration
  - ServiceNow
  - Reports

validateFile:
  stage: Validation
  image: python:3.11-slim
  script:
    - python3 install -r requirements.txt
    - python3 src/jobs/validate.py
  artifacts:
    paths: [validation.log, validated.json]
    expire_in: 30 days
  when: always

generateSuggestions:
  stage: AI Agent
  needs: [validateFile]
  image: python:3.11-slim
  script:
    - echo  "Code for generating suggesstions"
  artifacts:
    paths: [suggestions.json, ai.log]
    expire_in: 30 days
  rules:
    - if: '$RUN_AI_AGENT == "true"'
    - when: never

configureSaviynt:
  stage: Configuration
  needs: [validateFile]
  image: python:3.11-slim
  script:
    - echo "code for configuration"
  artifacts:
    paths: [config.log, saviynt_output.json]
    expire_in: 30 days
  rules:
    - if: '$RUN_CONFIGURE == "true"'
    - when: never

