variables:
  scheduleJob: "false"
  operation: "validate"
  GENERATE_SUGGESTIONS: "false"
  ROLE_MINING: "false"

stages:
  - validation
  - configuration

workflow:
  name: "$APPLICAION PipeLine"
  rules:
    - if: $CI_PIPELINE_TRIGGERED == "true"
    - if: $operation == "validate"
    - if: $operation == "config"
    - if: $GENERATE_SUGGESTIONS == "false"
    - if: $ROLE_MINING == "true"
    - if: $scheduleJob =="true"
    - when: never

extractFiles:
  stage: validation
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  rules:
    - if: $operation == "validate"
  script:
    - python3 src/jobs/updateValidationFlag.py not_completed
    - python3 src/jobs/extract.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  when: always

scheduledDataExtractandPolling:
  stage: validation
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  rules:
    - if: $scheduleJob =="true"
  script:
    - apt-get update && apt-get install -y git
    # Configure Git identity for CI commits
    - git config --global user.email "ci-bot@example.com"
    - git config --global user.name "CI Bot"
    # Reset remote URL to use CI_JOB_TOKEN for authentication
    - git remote set-url origin https://haribalanofficial:glpat-IsTp9BKWN_CyPq7Gf4KCw286MQp1Omc0OXNxCw.01.120ql49tm@gitlab.com/haribalanofficial/iga-saviynt-factory.git
    - git stash push -m "pre-snowtask stash"
    - git checkout Developnment
    - git pull origin Developnment
    - git stash pop || echo "Nothing to pop"
    - python3 src/jobs/extractDB.py  
    - python3 src/jobs/polling.py 
    - git add artifacts/*

    # Commit & push only if changes are present
    - |
      if ! git diff --cached --quiet; then
        git commit -m "update extracted artifacts [skip ci]"
        git push origin HEAD:refs/heads/Developnment

      else
        echo "No changes detected in artifacts, skipping commit."
      fi
  artifacts:
    paths:
        - artifacts/
    expire_in: 30 days
  when: always

validateFile:
  stage: validation
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  needs: [extractFiles]
  rules:
    - if: $operation == "validate"
  script:
    - python3 src/jobs/extractDB.py
    - python3 src/jobs/validate.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  when: always

generateSuggestions:
  stage: validation
  needs: [validateFile]
  tags:
    - linux
    - gcp
  rules:
    - if: '$GENERATE_SUGGESTIONS == "true"'
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory/python:ai
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - python3 src/jobs/generateSuggestions.py
  when: always

generateRoleRecommendation:
  stage: validation
  tags:
    - linux
    - gcp
  needs:
    - job: generateSuggestions
      artifacts: true
      optional: true
    - job: validateFile
      artifacts: true
      optional: true
  rules:
    - if: $ROLE_MINING == "true"
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory/python:ai
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - pip install scikit-learn
    - python3 src/jobs/roleMining.py

updateValidationFlag:
  stage: validation
  needs:
    - job: generateRoleRecommendation
      artifacts: true
      optional: true
    - job: generateSuggestions
      artifacts: true
      optional: true
    - job: validateFile
      artifacts: true
      optional: true
  rules:
    - if: $operation == "validate"
  image: python:3.11-slim
  script:
    - pip install requests
    - python3 src/jobs/updateValidationFlag.py completed
  when: always

#--------------configuration------------------------

auto_Validate_Onboarding_Sheet_Prod_Onboarding_Sheet:
  stage: configuration
  rules:
    - if: $operation == "config"
    - when: never
  needs:
    - job: validateFile
      artifacts: true
      optional: true
  image: alpine:latest
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - echo "Validate Onboarding Sheet_Prod Onboarding Sheet"
  when: always
  
config_CreateJiraTask:
  stage: configuration
  rules:
  - if: $operation == "config"
  - when: never
  needs:
    - job: auto_Validate_Onboarding_Sheet_Prod_Onboarding_Sheet
      artifacts: true
      optional: true
  image: alpine:latest
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - echo " Jira task creation"
  when: always

auto_Configure_Prod_LISA:
  stage: configuration
  rules:
  - if: $operation == "config"
  - when: never
  needs:
    - job: config_CreateJiraTask
      artifacts: true
      optional: true
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - python3 src/jobs/config.py
  when: always

config_closeJiraTask:
  stage: configuration
  rules:
  - if: $operation == "config"
  - when: never
  needs:
    - job: auto_Configure_Prod_LISA
      artifacts: true
      optional: true
  image: alpine:latest
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - echo " Jira task closed"
  when: always

auto_Selenium_Reconciliation_Report_Prod_LISA:
  stage: configuration
  needs:
  - job: config_closeJiraTask
    artifacts: true
    optional: true
  - job: auto_Configure_Prod_LISA
    artifacts: true
  rules:
  - if: $operation == "config"
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  script:
    - pip install junit-xml pytest pytest-html
    - python3 src/jobs/reports.py
    # - pytest src/jobs/reports.py --html=artifacts/report.html --self-contained-html
  artifacts:
    paths:
      - logs/
      - artifacts/
    reports:
      junit: artifacts/report.xml
    expire_in: 90 days
  when: always


factory_Residual_Configuration_Prod_LISA:
  stage: configuration
  needs: [auto_Selenium_Reconciliation_Report_Prod_LISA]
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  rules:
  - if: $operation == "config"
  script:
    - apt-get update && apt-get install -y git
    # Configure Git identity for CI commits
    - git config --global user.email "ci-bot@example.com"
    - git config --global user.name "CI Bot"
    # Reset remote URL to use CI_JOB_TOKEN for authentication glpat-IsTp9BKWN_CyPq7Gf4KCw286MQp1Omc0OXNxCw.01.120ql49tm
    - git remote set-url origin https://haribalanofficial:glpat-IsTp9BKWN_CyPq7Gf4KCw286MQp1Omc0OXNxCw.01.120ql49tm@gitlab.com/haribalanofficial/iga-saviynt-factory.git
    - export nextjob="factory_Receive_Post_Prod_Implementation_Sign_Off_Prod_LISA" 
    - git stash push -m "pre-snowtask stash"
    - git checkout Developnment
    - git pull origin Developnment
    - git stash pop || echo "Nothing to pop"
    - python3 src/jobs/snowtask.py
    - git add artifacts/*
    
    - |
      if ! git diff --cached --quiet; then
        git commit -m "update extracted artifacts [skip ci]"
        git push origin HEAD:refs/heads/Developnment
      else
        echo "No changes detected in artifacts, skipping commit."
      fi

    
  artifacts:
    paths: 
      - artifacts/*.json
    expire_in: 30 days
  when: always

factory_Receive_Post_Prod_Implementation_Sign_Off_Prod_LISA:
  stage: configuration
  needs: [factory_Residual_Configuration_Prod_LISA]
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  rules:
  - if: $operation == "config"
  script:
    - apt-get update && apt-get install -y git
    # Configure Git identity for CI commits
    - git config --global user.email "ci-bot@example.com"
    - git config --global user.name "CI Bot"
    # Reset remote URL to use CI_JOB_TOKEN for authentication
    - git remote set-url origin https://haribalanofficial:glpat-IsTp9BKWN_CyPq7Gf4KCw286MQp1Omc0OXNxCw.01.120ql49tm@gitlab.com/haribalanofficial/iga-saviynt-factory.git
    - export nextjob="factory_Go-Live_Hyper_Care" 
    - git stash push -m "pre-snowtask stash"
    - git checkout Developnment
    - git pull origin Developnment
    - git stash pop || echo "Nothing to pop"
    - python3 src/jobs/snowtask.py 
    - git add artifacts/*

    # Commit & push only if changes are present
    - |
      if ! git diff --cached --quiet; then
        git commit -m "update extracted artifacts [skip ci]"
        git push origin HEAD:refs/heads/Developnment

      else
        echo "No changes detected in artifacts, skipping commit."
      fi
  artifacts:
    paths: 
      - artifacts/*.json
    expire_in: 30 days
  when: manual

factory_Go-Live_Hyper_Care:
  stage: configuration
  needs: [factory_Receive_Post_Prod_Implementation_Sign_Off_Prod_LISA]
  image: alpine:latest
  script:
    - echo "Final stage completed"
  artifacts:
    paths:
      - artifacts/*.json
    expire_in: 30 days
  rules:
  - if: $operation == "config"
  when: manual

