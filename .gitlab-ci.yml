variables:
  scheduleJob: "false"
  operation: "config"
  RUN_AI_AGENT: "false"

workflow:
  name: "Testing PipeLine"
  rules:
    - if: $operation == "validate"
    - if: $operation == "config"
    - if: $RUN_AI_AGENT == "true"
    - when: never

stages:
  - Pre-Processing
  - Validation
  - AI Agent
  - Configuration
  - ServiceNow
  - Reports

extractFiles:
  stage: Pre-Processing
  image: python:latest
  rules:
    - if: $operation == "validate"
    - if: $operation == "config"
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/extract.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  when: always

scheduledDataExtract:
  stage: Pre-Processing
  image: python:latest
  rules:
    - if: $scheduleJob =="true"
      when: always
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/extractDB.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  when: always

validateFile:
  stage: Validation
  image: python:latest
  rules:
    - if: $operation == "validate"
    - if: $operation == "config"
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/validate.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  when: always

generateSuggestions:
  stage: AI Agent
  needs: [validateFile,extractFiles]
  rules:
    - if: '$RUN_AI_AGENT == "true"'
  image: python:3.11-slim
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - echo  "Code for generating suggesstions"

generateRoleRecommodation:
  stage: AI Agent
  needs: [validateFile,extractFiles]
  rules:
    - if: '$RUN_AI_AGENT == "true"'
  image: python:3.11-slim
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - echo  "Code for generating Role suggesstions"

configureSaviynt:
  stage: Configuration
  rules:
  - if: '$operation == "config"'
  - when: never
  needs:
    - job: extractFiles
      artifacts: true
    - job: validateFile
      artifacts: true
      optional: true
  image: python:3.11-slim
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - python3 src/jobs/config.py
  when: always


