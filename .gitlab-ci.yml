variables:
  scheduleJob: "false"
  operation: "config"
  GENERATE_SUGGESTIONS: "true"
  ROLE_MINING: "true"

workflow:
  name: "$APPLICAION PipeLine"
  rules:
    - if: $CI_PIPELINE_TRIGGERED == "true"
    - if: $operation == "validate"
    - if: $operation == "config"
    - if: $GENERATE_SUGGESTIONS == "false"
    - if: $ROLE_MINING == "true"
    - when: never

stages:
  - Pre-Processing
  - Validation
  - AI Agent
  - Configuration
  - ServiceNow
  - Reports

extractFiles:
  stage: Pre-Processing
  image: python:latest
  rules:
    - if: $operation == "validate"
    - if: $operation == "config"
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/extract.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  when: always

scheduledDataExtract:
  stage: Pre-Processing
  image: python:latest
  rules:
    - if: $scheduleJob =="true"
      when: always
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/extractDB.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  when: always

validateFile:
  stage: Validation
  image: python:latest
  rules:
    - if: $operation == "validate"
    - if: $operation == "config"
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/extractDB.py
    - python3 src/jobs/validate.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  when: always

generateSuggestions:
  stage: AI Agent
  needs: [validateFile,extractFiles]
  rules:
    - if: '$GENERATE_SUGGESTIONS == "true"'
  image: python:3.11-slim
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - pip install -r requirements.txt
    - pip install sentence-transformers  torch
    - python3 src/jobs/generateSuggestions.py
  when: always

generateRoleRecommendation:
  stage: AI Agent
  needs: [validateFile,extractFiles]
  rules:
    - if: $ROLE_MINING == "true"
  image: python:3.11-slim
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/roleMining.py

configureSaviynt:
  stage: Configuration
  rules:
  - if: '$operation == "config"'
  - when: never
  needs:
    - job: extractFiles
      artifacts: true
    - job: validateFile
      artifacts: true
      optional: true
  image: python:3.11-slim
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/config.py
  when: always


createSCTasks:
  stage: ServiceNow
  needs: [configureSaviynt]
  image: python:3.11-slim
  rules:
  - if: '$operation == "config"'
  script:
    - echo "code to create sc_task"
  artifacts:
    paths: [sc_tasks.json]
    expire_in: 30 days
  when: always

waitForSCTasks:
  stage: ServiceNow
  needs: [createSCTasks]
  image: python:3.11-slim
  script:
    - echo "Code for polling "
  artifacts:
    paths: [task_status.json]
    expire_in: 30 days
  rules:
  - if: '$operation == "config"'
  when: always

generateReports:
  stage: Reports
  needs:
  - job: extractFiles
    artifacts: true
  - job: validateFile
    artifacts: true
  - job: configureSaviynt
    artifacts: true
  rules:
  - if: $operation == "config"
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/reports.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 90 days
  when: always
