variables:
  scheduleJob: "false"
  operation: "validate"
  GENERATE_SUGGESTIONS: "true"
  ROLE_MINING: "true"
  

workflow:
  name: "$APPLICAION PipeLine"
  rules:
    - if: $CI_PIPELINE_TRIGGERED == "true"
    - if: $operation == "validate"
    - if: $operation == "config"
    - if: $GENERATE_SUGGESTIONS == "false"
    - if: $ROLE_MINING == "true"
    - if: $scheduleJob =="true"
    - when: never

extractFiles:
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  rules:
    - if: $operation == "validate"
  script:
    - python3 src/jobs/extract.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  when: always

scheduledDataExtractandPolling:
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  rules:
    - if: $scheduleJob =="true"
  script:
    - apt-get update && apt-get install -y git
    # Configure Git identity for CI commits
    - git config --global user.email "ci-bot@example.com"
    - git config --global user.name "CI Bot"
    # Reset remote URL to use CI_JOB_TOKEN for authentication
    - git remote set-url origin https://haribalanofficial:glpat-mRvT2HLveY111B5TLKjOY286MQp1Omc0OXNxCw.01.120xpphbm@gitlab.com/haribalanofficial/iga-saviynt-factory.git
    - python3 src/jobs/extractDB.py 
    - git checkout Developnment 
    - git pull origin Developnment
    - python3 src/jobs/polling.py 
    - git add artifacts/*

    # Commit & push only if changes are present
    - |
      if ! git diff --cached --quiet; then
        git commit -m "update extracted artifacts [skip ci]"
        git push origin HEAD:refs/heads/Developnment

      else
        echo "No changes detected in artifacts, skipping commit."
      fi
  artifacts:
    paths:
        - artifacts/
    expire_in: 30 days
  when: always

validateFile:
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  needs: [extractFiles]
  rules:
    - if: $operation == "validate"
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/extractDB.py
    - python3 src/jobs/validate.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  when: always

generateSuggestions:
  needs: [validateFile]
  rules:
    - if: '$GENERATE_SUGGESTIONS == "true"'
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - pip install -r requirements.txt
    # pip install sentence-transformers  torch
    - python3 src/jobs/generateSuggestions.py
  when: always

generateRoleRecommendation:
  needs: [generateSuggestions]
  rules:
    - if: $ROLE_MINING == "true"
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - pip install -r requirements.txt
    - pip install scikit-learn
    - python3 src/jobs/roleMining.py

configureSaviynt:
  rules:
  - if: '$operation == "config"'
  - when: never
  needs:
    - job: extractFiles
      artifacts: true
      optional: true
    - job: validateFile
      artifacts: true
      optional: true
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 30 days
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/config.py
  when: always

generateReports:
  needs:
  - job: extractFiles
    artifacts: true
    optional: true
  - job: validateFile
    artifacts: true
    optional: true
  - job: configureSaviynt
    artifacts: true

  rules:
  - if: $operation == "config"
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  script:
    - pip install -r requirements.txt
    - python3 src/jobs/reports.py
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 90 days
  when: always


configResidual:
  needs: [generateReports]
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  rules:
  - if: '$operation == "config"'
  script:
    - apt-get update && apt-get install -y git
    # Configure Git identity for CI commits
    - git config --global user.email "ci-bot@example.com"
    - git config --global user.name "CI Bot"
    # Reset remote URL to use CI_JOB_TOKEN for authentication
    - git remote set-url origin https://haribalanofficial:glpat-mRvT2HLveY111B5TLKjOY286MQp1Omc0OXNxCw.01.120xpphbm@gitlab.com/haribalanofficial/iga-saviynt-factory.git
    - export nextjob="batTesting"
    - pip install -r requirements.txt  
    - git checkout Developnment 
    - git pull origin Developnment
    - python3 src/jobs/snowtask.py
    - git add artifacts/*

    # Commit & push only if changes are present
    - |
      if ! git diff --cached --quiet; then
        git commit -m "update extracted artifacts [skip ci]"
        git push origin HEAD:refs/heads/Developnment

      else
        echo "No changes detected in artifacts, skipping commit."
      fi
    
  artifacts:
    paths: 
      - artifacts/*.json
    expire_in: 30 days
  when: always

batTesting:
  needs: [configResidual]
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  rules:
  - if: '$operation == "config"'
  script:
    - apt-get update && apt-get install -y git
    # Configure Git identity for CI commits
    - git config --global user.email "ci-bot@example.com"
    - git config --global user.name "CI Bot"
    # Reset remote URL to use CI_JOB_TOKEN for authentication
    - git remote set-url origin https://haribalanofficial:glpat-mRvT2HLveY111B5TLKjOY286MQp1Omc0OXNxCw.01.120xpphbm@gitlab.com/haribalanofficial/iga-saviynt-factory.git
    - export nextjob="signOff"
    - git checkout Developnment 
    - git pull origin Developnment
    - python3 src/jobs/snowtask.py 
    - git add artifacts/*

    # Commit & push only if changes are present
    - |
      if ! git diff --cached --quiet; then
        git commit -m "update extracted artifacts [skip ci]"
        git push origin HEAD:refs/heads/Developnment

      else
        echo "No changes detected in artifacts, skipping commit."
      fi
  artifacts:
    paths: 
      - artifacts/*.json
    expire_in: 30 days
  when: manual

signOff:
  needs: [batTesting]
  image: registry.gitlab.com/haribalanofficial/iga-saviynt-factory:latest
  script:
    - pip install -r requirements.txt
  artifacts:
    paths:
      - artifacts/*.json
    expire_in: 30 days
  rules:
  - if: '$operation == "config"'
  when: manual

