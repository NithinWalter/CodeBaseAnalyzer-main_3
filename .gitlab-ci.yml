generateReports:
  stage: Reports
  needs:
  - job: extractFiles
    artifacts: true
  - job: validateFile
    artifacts: true
  - job: configureSaviynt
    artifacts: true
  image: python:3.11-slim
  script:
    - echo "code for reports and artifacts"
  artifacts:
    paths:
      - logs/
      - artifacts/
    expire_in: 90 days
  when: always
